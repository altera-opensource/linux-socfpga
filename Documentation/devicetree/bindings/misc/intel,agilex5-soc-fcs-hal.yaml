%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/intel,agilex5-soc-fcs-hal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Altera SoC FPGA HAL

maintainers:
  - Balsundar Ponnusamy <balsundar.ponnusamy@altera.com>
  - Sagar Khadgi <sagar.khadgi@altera.com>
  - Santosh Male <santosh.male@altera.com>
  - Mahesh Rao <mahesh.rao@altera.com>

properties:
  compatible:
    enum:
      - intel,agilex5-soc-fcs-hal
      - intel,agilex-soc-fcs-hal

required:
  - compatible

additionalProperties: false

examples:
  - |
    firmware {
      svc {
        fcs_hal: fcs-hal {
          compatible = "intel,agilex5-soc-fcs-hal";
        };
      };
    };
