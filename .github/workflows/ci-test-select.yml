name: Test Selection Flow For CI

on:
  workflow_call:
    secrets:
      GIT_USER:
        required: true
      GIT_TOKEN:
        required: true
      AGPT_TOKEN:
        required: true
    inputs:
      base_ref:
        required: true
        type: string
      head_ref:
        required: true
        type: string

env:
  WORKFLOW_REPO_REF: cicd-2026.03

jobs:
  ci-testrun-ai-filter:
    runs-on: [lapwing, arc, workspace_type=tmp-workspace, mem=16000, git, python/3.12.10]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate diff
          ref: ${{ inputs.head_ref }}

      - name: Checkout workflow script
        uses: actions/checkout@v4
        with:
          repository: altera-innersource/applications.devops.build-bot.github-pr-workflow
          ref: ${{ env.WORKFLOW_REPO_REF }}
          path: workflow_scripts
          token: ${{ secrets.GIT_TOKEN }}

      - name: Get CI Run Options
        id: run-options
        uses: ./.github/actions/ci-run-options
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          script_dir: workflow_scripts

      - name: Setup Default Outputs
        run: |
          echo test_tags="${{ steps.run-options.outputs.test_tags }}"
          echo test_user_prompt="${{ steps.run-options.outputs.user_test_prompt }}"
          echo '[]' > user_filtered_tests.json
          touch default_reasoning.txt

      - name: Fetch base branch
        run: |
          git fetch origin ${{ inputs.base_ref }}

      - name: create PR diff file
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 workflow_scripts/make_pr_diff_json.py \
              --local-diff-base origin/${{ inputs.base_ref }} \
              --local-diff-head ${{ inputs.head_ref }} \
              --repo ${{ github.repository }} \
              --title "${{ github.event.pull_request.title }}" \
              --output pr_diff.json
          else
            echo "Not a pull request event, skipping PR diff creation"
            touch pr_diff.json
          fi
          echo "Generated PR diff:"
          cat pr_diff.json

      - name: AGPT user test select
        if: ${{ !contains(fromJSON(steps.run-options.outputs.test_tags), 'all') && steps.run-options.outputs.user_test_prompt }}
        shell: bash
        env:
          AGPT_API_KEY: ${{ secrets.AGPT_TOKEN }}
          AGPT_SESSION_PATH: ${{ runner.temp }}
        run: |
          python3 workflow_scripts/agpt_run.py \
            --file pr_diff.json \
            --file workflow_scripts/regtest/linux/test_config.json \
            --save-answer user_filtered_tests.json \
            --new \
            -p "${{ steps.run-options.outputs.user_test_prompt }}"

      - name: Explain the reason of user test selection
        if: ${{ !contains(fromJSON(steps.run-options.outputs.test_tags), 'all') && steps.run-options.outputs.user_test_prompt }}
        env:
          AGPT_API_KEY: ${{ secrets.AGPT_TOKEN }}
          AGPT_SESSION_PATH: ${{ runner.temp }}
        run: |
          python3 workflow_scripts/agpt_run.py --raw-output=answer \
            < workflow_scripts/prompts/common/describe_test_select.txt >> user_reasoning.txt
          cat user_reasoning.txt

      - name: AGPT select test
        if: ${{ !contains(fromJSON(steps.run-options.outputs.test_tags), 'all') }}
        shell: bash
        env:
          AGPT_API_KEY: ${{ secrets.AGPT_TOKEN }}
          AGPT_SESSION_PATH: ${{ runner.temp }}
        run: |
          python3 workflow_scripts/agpt_run.py \
            --file pr_diff.json \
            --file workflow_scripts/regtest/linux/test_config.json \
            --save-answer default_filtered_tests.json \
            --new \
            < workflow_scripts/prompts/linux/default_test_select.txt \
          || {
            echo -e "\033[1;31m AI prompt failed, default to force full test run\033[0m"
            cp workflow_scripts/regtest/linux/test_config.json default_filtered_tests.json
          }

      - name: Explain the reason of test selection
        if: ${{ !contains(fromJSON(steps.run-options.outputs.test_tags), 'all') }}
        env:
          AGPT_API_KEY: ${{ secrets.AGPT_TOKEN }}
          AGPT_SESSION_PATH: ${{ runner.temp }}
        run: |
          python3 workflow_scripts/agpt_run.py --raw-output=answer \
            < workflow_scripts/prompts/common/describe_test_select.txt \
            >> default_reasoning.txt
          cat default_reasoning.txt

      - name: Merge user-selected and AI-selected tests
        if: ${{ !contains(fromJSON(steps.run-options.outputs.test_tags), 'all') }}
        run: |
          python3 workflow_scripts/testcase_db_manager.py --database default_filtered_tests.json \
            --output filtered_tests.json add-test-cases --new-database user_filtered_tests.json
          echo "hello"

      - name: Merge AI test select report
        if: ${{ !contains(fromJSON(steps.run-options.outputs.test_tags), 'all') }}
        env:
          AGPT_API_KEY: ${{ secrets.AGPT_TOKEN }}
          AGPT_SESSION_PATH: ${{ runner.temp }}
        run: |
          echo "## � AI Test Selection Reasoning" > reasoning.txt
          if [ -f 'user_reasoning.txt' ]; then
            python3 workflow_scripts/agpt_run.py --new --raw-output=answer \
              --file default_reasoning.txt --file user_reasoning.txt \
              < workflow_scripts/prompts/common/merge_test_select_report.txt \
              >> reasoning.txt
          else
            echo 'no user_reasoning.txt, skip report merging'
            cat default_reasoning.txt >> reasoning.txt
          fi
          cat reasoning.txt

      - name: Manual Test Select
        if: ${{ contains(fromJSON(steps.run-options.outputs.test_tags), 'all') }}
        run: |
          keyword_q=$(echo '${{ steps.run-options.outputs.test_tags }}' | jq -r 'map(select(. != "all")) | map("contains(keyword, `" + . + "`)") | join(" || ")')
          if [ -n "$keyword_q" ]; then
            keyword_q='keyword && ('$keyword_q') &&'
          fi
          jmes='[?'$keyword_q' (!disabled || disabled == `0`)]'
          echo $jmes
          python3 workflow_scripts/testcase_db_manager.py \
            --database workflow_scripts/regtest/linux/test_config.json \
            --output filtered_tests.json \
            list-test-cases "$jmes"

      - name: Manual test selection report
        if: ${{ contains(fromJSON(steps.run-options.outputs.test_tags), 'all') }}
        env:
          AGPT_API_KEY: ${{ secrets.AGPT_TOKEN }}
          AGPT_SESSION_PATH: ${{ runner.temp }}
        run: |
          keywords=$(echo '${{ steps.run-options.outputs.test_tags }}' | jq -r 'join(",")' )
          echo "## Manual Test Select Report" > reasoning.txt
          python3 workflow_scripts/workflow_GenerateManualTestSelectReport.py filtered_tests.json --keywords="$keywords" \
            >> reasoning.txt
          cat reasoning.txt

      - name: Post test selection reason as PR comment
        if: github.event_name == 'pull_request'
        run: |
          python3 workflow_scripts/workflow_TestSelectReport.py --github-token ${{ secrets.GIT_TOKEN }} \
            --github-repo ${{ github.repository }} -p ${{ github.event.pull_request.number }} \
            -r ${{ github.run_id }} -a ${{ github.run_attempt }} \
            --body-file reasoning.txt --header "<!-- TEST SELECTION REPORT -->"

      - run: |
            tar -cvf test_select_reports.tar *reasoning.txt

      - name: Upload Test Select Report
        uses: actions/upload-artifact@v4
        with:
          name: test-select-report
          path: ${{ github.workspace }}/test_select_reports.tar
          retention-days: 1

      - name: Upload filtered test JSON
        uses: actions/upload-artifact@v4
        with:
          name: filtered-test-json
          path: ${{ github.workspace }}/filtered_tests.json
          retention-days: 1
